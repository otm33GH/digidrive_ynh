version = "1.0"

[main]
name.en = "Configuration panel"
name.fr = "Panneau de configuration"

[main.apps]
name.en = "Adding applications"
name.fr = "Ajout des applications"
help.en = "You wiil need to rebuild app (pulling rebuild button) after saving app's url" 
help.fr = "Il faudra recompiler l'application (bouton rebuild) après avoir enregistré les adresses des applications"


